name: Build & Release (unstable)

on:
  push:
    branches:
      - unstable

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Read version from __init__.py
        id: version
        run: |
          BASE=$(python3 -c "
          import re, sys
          text = open('Plugins/Extensions/EpgToXml/__init__.py').read()
          m = re.search(r'VERSION\s*=\s*\"([^\"]+)\"', text)
          if not m:
              sys.exit('VERSION not found')
          print(m.group(1))
          ")
          SHA=$(git rev-parse --short HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "full=${BASE}~unstable+${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          python3 tools/build_deb.py \
            --version-override "${{ steps.version.outputs.full }}"

      - name: Update unstable-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DEB=$(ls dist/*.deb)
          TAG="unstable-latest"

          # Delete existing tag + release so we can re-create cleanly
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" "$DEB" \
            --title "Unstable ${{ steps.version.outputs.full }}" \
            --notes "Automatischer Build vom Branch \`unstable\` (Commit \`${{ steps.version.outputs.sha }}\`)." \
            --prerelease \
            --target unstable
