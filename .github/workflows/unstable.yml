name: Build & Release (unstable)

on:
  push:
    branches:
      - unstable

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Read version from __init__.py
        id: version
        run: |
          BASE=$(python3 -c "
          import re, sys
          text = open('Plugins/Extensions/EpgToXml/__init__.py').read()
          m = re.search(r'VERSION\s*=\s*\"([^\"]+)\"', text)
          if not m:
              sys.exit('VERSION not found')
          print(m.group(1))
          ")
          SHA=$(git rev-parse --short HEAD)
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "full=${BASE}~unstable${{ github.run_number }}+${SHA}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Build .deb and .ipk
        run: |
          python3 tools/build_deb.py \
            --version-override "${{ steps.version.outputs.full }}"
          python3 tools/build_ipk.py \
            --version-override "${{ steps.version.outputs.full }}"

      - name: Update unstable-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="unstable-latest"

          # Delete existing tag + release so we can re-create cleanly
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true

          gh release create "$TAG" dist/*.deb dist/*.ipk \
            --title "Unstable ${{ steps.version.outputs.full }}" \
            --notes "Automatischer Build vom Branch \`unstable\` (Commit \`${{ steps.version.outputs.sha }}\`)." \
            --prerelease \
            --target unstable

      - name: Trigger Dreambox feed publication
        env:
          GH_TOKEN: ${{ secrets.FEED_DISPATCH_TOKEN }}
        run: |
          test -n "$GH_TOKEN" || {
            echo "::warning::FEED_DISPATCH_TOKEN is not configured; skipping feed publication"
            exit 0
          }
          gh api --method POST repos/Arcardus/dreambox-feed/dispatches \
            -f event_type=package-published \
            -f "client_payload[repository]=$GITHUB_REPOSITORY" \
            -f "client_payload[channel]=unstable" \
            -f "client_payload[tag]=unstable-latest"
