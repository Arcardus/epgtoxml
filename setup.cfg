[tool:pytest]
testpaths = tests
addopts = -v

[flake8]
max-line-length = 120
exclude =
    .git,
    __pycache__,
    dist,
    build,
    Plugins/Extensions/EpgToXml/epgimport_engine
per-file-ignores =
    # Plugin file uses try/except for Enigma2 imports that are unavailable in dev
    Plugins/Extensions/EpgToXml/plugin.py:F401
